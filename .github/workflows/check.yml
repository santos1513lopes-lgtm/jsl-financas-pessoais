name: Verificar aplicativo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: node --check assets/vault.js && node --check assets/auth.js && node --check assets/app.js && node --check sw.js
